services:
  mealie:
    container_name: mealie
    image: ${MEALIE_IMAGE:-mealie:personal-infra}
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      target: production
      args:
        COMMIT: ${COMMIT:-unknown}
    restart: unless-stopped
    volumes:
      - ${MEALIE_DATA_DIR:-/srv/apps/mealie/data}:/app/data/
    environment:
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      BASE_URL: ${MEALIE_BASE_URL}
      DB_ENGINE: postgres
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PGID: ${PGID:-1000}
      POSTGRES_DB: ${POSTGRES_DB:-mealie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_SERVER: ${POSTGRES_SERVER:-personal-infra-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-mealie}
      PUID: ${PUID:-1000}
      TZ: ${TZ:-UTC}
    networks:
      - shared

networks:
  shared:
    external: true
    name: ${SHARED_NETWORK_NAME:-personal-infra-shared}
